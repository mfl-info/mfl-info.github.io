.newsroom-list{display:grid;gap:14px;margin-top:28px;max-width:980px}

.news-headline:focus-visible{outline:2px solid #f3cf72;outline-offset:3px}

.news-headline time{display:block;font-size:.78rem;opacity:.62;margin-bottom:8px}
.news-headline h3{margin:0;padding-right:4px;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.4;transition:color .18s ease}
.news-headline:hover h3{color:#f3cf72}
.news-headline .read{display:inline-flex;align-items:center;gap:9px;margin-top:14px;padding:8px 13px;border:1px solid rgba(243,207,114,.38);border-radius:999px;background:rgba(243,207,114,.08);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.92;color:#f3cf72;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.news-headline .read::after{content:'›';font-size:1.1rem;line-height:.7;transition:transform .18s ease}
.news-headline:hover .read{background:rgba(243,207,114,.16);border-color:rgba(243,207,114,.7)}
.news-headline:hover .read::after{transform:translateX(3px)}
.news-headline:active .read{transform:scale(.97)}
@media(max-width:600px){.news-headline{padding:17px 17px 18px}.news-headline .read{margin-top:12px}.news-headline:hover{transform:none}.news-headline:active{transform:scale(.985)}}
.news-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;display:none;overflow-y:auto;padding:30px 16px}
.news-modal.open{display:block}
.news-article{max-width:900px;margin:35px auto;background:var(--card,#171717);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:clamp(24px,5vw,52px);position:relative;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.news-article time{font-size:.82rem;opacity:.62}
.news-article h1{font-size:clamp(1.65rem,4vw,2.8rem);line-height:1.2;margin:12px 45px 28px 0}
.news-article p{font-size:1rem;line-height:1.85;margin:0 0 18px;opacity:.9}
.news-close{position:absolute;right:18px;top:15px;border:0;background:transparent;color:inherit;font-size:30px;line-height:1;cursor:pointer;opacity:.7}
.news-close:hover{opacity:1}
.news-back{margin-top:25px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;border-radius:999px;padding:10px 17px;cursor:pointer}
body.modal-open{overflow:hidden}

<script src="config.js?v=23"></script><script src="script.js?v=23"></script><script src="i18n.js?v=23"></script>
<script>
const news=[
{date:'October 6, 2026',title:'Official Announcement: MFL Season 7',body:[`The Management Committee of the Masjidpara Football League (MFL) has officially decided that MFL Season 7 will be held during Eid-ul-Fitr.`,`The decision was taken and finalized by the Management Committee on October 6, 2026.`,`Further details regarding the tournament schedule, registration, participating teams, tournament format, and other related matters will be announced by the Management Committee in due course.`,`All teams, players, and concerned members are requested to follow the official MFL updates for further information.`]},
{date:'May 13, 2026',title:'Partnering with NorthByte: MFL Season 6',body:[`The Masjidpara Football League (MFL) is pleased to announce NorthByte as an official partner of MFL Season 6.`,`NorthByte will be supporting the upcoming season as part of the tournament's partnership program. The partnership has been established with the objective of supporting the organization and successful execution of MFL Season 6.`,`The Management Committee acknowledges NorthByte's support and cooperation for the upcoming tournament.`]},
{date:'May 11, 2026',title:'Official Schedule Announcement: MFL Season 6',body:[`The Management Committee of the Masjidpara Football League (MFL) has officially announced the schedule for MFL Season 6.`,`The tournament will be held from the 2nd day to the 4th day of Eid-ul-Adha.`,`Further information regarding match timings, fixtures, participating teams, and other tournament arrangements will be communicated through the official MFL channels.`,`All participating teams and players are requested to follow the official schedule and subsequent announcements.`]},
{date:'May 11, 2026',title:'Partnering with City Cosmetics: MFL Season 6',body:[`The Masjidpara Football League (MFL) is pleased to announce City Cosmetics as an official partner of MFL Season 6.`,`City Cosmetics will support the upcoming tournament as part of the MFL partnership program.`,`The Management Committee acknowledges the support and cooperation of City Cosmetics and appreciates their involvement in the organization of MFL Season 6.`]},
{date:'May 6, 2026',title:'Sponsorship Proposal: MFL Season 6',body:[`The Masjidpara Football League (MFL) has officially opened its sponsorship and partnership opportunities for MFL Season 6.`,`Businesses and organizations interested in becoming official partners of the tournament may contact the MFL Management Committee for further information regarding available sponsorship opportunities.`,`The sponsorship program has been introduced to support the organization and overall activities of the upcoming tournament.`,`Further details regarding sponsorship opportunities and partnership arrangements will be provided by the Management Committee upon request.`]},
{date:'April 5, 2026',title:'Squad Update: Player Substitution for Team Atik',body:[`The MFL Management Committee has officially approved a player substitution in the squad of Team Atik.`,`Player Punok has been replaced by Bishal in the Team Atik squad.`,`The substitution has been made due to Punok's upcoming HSC examinations, which will prevent him from participating in the tournament.`,`The substitution is effective immediately, and Bishal will represent Team Atik in place of Punok for the remainder of the tournament.`]},
{date:'March 30, 2026',title:'In Memoriam: Tarek (Brotherhood-7)',body:[`The Masjidpara Football League (MFL) records with deep sorrow the passing of Tarek, the goalkeeper of Brotherhood-7 and an official member of the MFL Season 6 squad.`,`Tarek was registered as a member of the Brotherhood-7 squad and was scheduled to participate in MFL Season 6.`,`The MFL Management Committee extends its condolences to his family, teammates, friends, and all those affected by his passing.`,`The Management Committee prays for his departed soul and expresses its respect for his contribution as a member of the MFL community.`]},
{date:'March 2, 2026',title:'Official Lottery Date: MFL Season 6',body:[`The MFL Management Committee has officially announced the date, time, and venue for the group and fixture draw of MFL Season 6.`,`Date: April 17, 2026`,`Time: 5:00 PM`,`Venue: BaganBari Ujjwal Ground`,`All team captains are requested to attend the official draw.`,`The group allocation and fixture arrangements for the tournament will be determined through the official draw.`]},
{date:'February 25, 2026',title:'Lottery Announcement: MFL Season 6',body:[`The MFL Management Committee has announced that the official group and fixture draw for MFL Season 6 will be held as part of the tournament preparation process.`,`The date, time, and venue of the draw will be announced separately by the Management Committee.`,`All participating team captains are requested to remain updated through the official MFL communication channels and follow subsequent announcements regarding the draw.`]},
{date:'January 17, 2026',title:'Official Announcement: MFL Season 6',body:[`The MFL Management Committee has officially decided that MFL Season 6 will be held after Eid-ul-Adha.`,`The decision was finalized during a Management Committee meeting held on January 17, 2026.`,`All participating teams are requested to make the necessary preparations accordingly.`,`Further details regarding the tournament schedule, registration, fixtures, and other arrangements will be announced by the Management Committee at a later date.`]}
];
const modal=document.getElementById('newsModal'), dateEl=document.getElementById('newsDate'), titleEl=document.getElementById('newsTitle'), bodyEl=document.getElementById('newsBody');
function openNews(i){const n=news[i];dateEl.textContent=n.date;titleEl.textContent=n.title;bodyEl.innerHTML=n.body.map(p=>`<p>${p}</p>`).join('');modal.classList.add('open');document.body.classList.add('modal-open');history.pushState({news:i},'',`#news-${i}`);document.getElementById('newsClose').focus()}
function closeNews(){modal.classList.remove('open');document.body.classList.remove('modal-open');if(location.hash.startsWith('#news-')) history.replaceState({},'',location.pathname+location.search)}
document.querySelectorAll('.news-headline').forEach(b=>b.addEventListener('click',()=>openNews(Number(b.dataset.news))));
document.getElementById('newsClose').addEventListener('click',closeNews);document.getElementById('newsBack').addEventListener('click',closeNews);modal.addEventListener('click',e=>{if(e.target===modal)closeNews()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeNews()});
window.addEventListener('popstate',()=>{if(!location.hash.startsWith('#news-')) closeNews()});
if(location.hash.startsWith('#news-')){const i=Number(location.hash.replace('#news-',''));if(news[i])openNews(i)}
</script>
