<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Head-to-Head | MFL</title><link rel="stylesheet" href="style.css?v=14"><link rel="icon" href="assets/favicon-mfl-only.png"></head><body><header class="nav"><div class="navin"><a class="brand" href="index.html"><img alt="MFL" class="brand-logo" src="assets/mfl-logo.png"><span><b>MOSJIDPARA</b><small>FOOTBALL LEAGUE • OFFICIAL</small></span></a><button class="menu">☰</button><nav class="links"><a href="index.html">Home</a><a href="teams.html">Team</a><a href="schedule.html">Schedule</a><a href="results.html">Result</a><a href="updates.html">Updates</a><a href="about.html">About</a></nav><a class="enroll" href="register.html">Register Now</a></div></header><main><section class="section"><div class="wrap"><div class="eyebrow">TEAM COMPARISON</div><h1>Head-to-<span>Head</span></h1><div class="h2h-select"><select id="a"></select><strong>VS</strong><select id="b"></select></div><div id="h2hResult" class="panel"><h2>Select two teams</h2><p class="lead">Verified match history will appear here as official results are added.</p></div></div></section></main><footer><div class="wrap footerin"><div><b>MFL</b><p>© 2026 MosjidPara Football League — MFL</p></div><div><p class="flinks"><a href="center.html">MFL Center</a><a href="results.html">Results</a><a href="teams.html">Teams</a></p></div></div></footer><script src="mfl-data.js?v=14"></script><script src="script.js?v=14"></script><script>const opts=MFL_DATA.teams.map(t=>`<option value="${t.name}">${t.name}</option>`).join('');a.innerHTML=opts;b.innerHTML=opts;b.selectedIndex=1;function update(){if(a.value===b.value){h2hResult.innerHTML='<h2>Choose two different teams</h2>';return}h2hResult.innerHTML=`<div class="compare-head"><b>${a.value}</b><span>VS</span><b>${b.value}</b></div><p class="lead">Head-to-head statistics will populate from verified MFL match records. No unverified score is shown.</p>
